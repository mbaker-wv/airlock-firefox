<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <section id="current" hidden>
    <div class="row">
      <span id="dot" class="dot"></span>
      <input id="name" type="text" maxlength="40" title="Rename this hat">
    </div>
    <label class="check">
      <input id="keep" type="checkbox">
      Keep this hat (stay signed in after closing its tabs)
    </label>
  </section>
  <p id="none" class="muted" hidden>This tab doesn't have a hat yet.</p>

  <button id="newSame" hidden>New tab in this hat <span class="key">⌥⌘T</span></button>
  <button id="newIsolated">New tab in a new hat <span class="key">⌘T</span></button>

  <section id="hatsSection" hidden>
    <h2>Your hats</h2>
    <ul id="hatList"></ul>
  </section>

  <hr>
  <label class="check toggle">
    <input id="auto" type="checkbox">
    Give every new tab its own hat
  </label>
  <nav class="links">
    <a id="manage" href="#">Manage hats</a>
    <a id="help" href="#">Setup &amp; help</a>
  </nav>

  <script src="popup.js"></script>
</body>
</html>
