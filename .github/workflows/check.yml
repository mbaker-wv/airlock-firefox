# Runs Hatrack's behavior tests and Mozilla's add-on linter on every push and pull
# request, so problems show up here before they reach Mozilla's review or users.
name: Check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 9 * * 1"   # weekly, to catch new Firefox/linter rules even without changes

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Behavior tests
        run: node tests/run.js
      - name: Lint with web-ext
        run: npx --yes web-ext@8 lint --source-dir . --ignore-files "tools/**" "tests/**" "store/**" "*.md"
